<!doctype html>
<html lang="pl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vectoria | Browser renderer benchmarks</title>
    <style>
      body { margin: 0; padding: 16px; font: 14px system-ui, sans-serif; background: var(--color-workspace, #20201e); color: #eee; }
      canvas { display: block; width: 960px; height: 540px; max-width: 100%; }
      #surface { position: relative; width: min(960px, 100%); height: 540px; overflow: hidden; }
      #surface canvas { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <main>
      <h1>Vectoria browser benchmark harness (B1–B6)</h1>
      <p data-testid="benchmark-ready" id="benchmark-status">Loading</p>
      <div id="surface">
        <canvas id="benchmark-background" aria-hidden="true"></canvas>
        <canvas id="benchmark-scene" aria-label="Benchmark render"></canvas>
      </div>
    </main>
    <script type="module" src="/benchmarks/runner.ts"></script>
  </body>
</html>
