name: VEC012 validation

on:
  pull_request:
    branches: [master]

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Chromium
        run: pnpm --filter @vectoria/web exec playwright install --with-deps chromium

      - name: Interaction regressions
        run: >-
          pnpm --filter @vectoria/web exec playwright test
          e2e/nudge.spec.ts
          e2e/escape.spec.ts
          e2e/vec004-interaction-lifecycle.spec.ts
          e2e/vec005-tool-lifecycle-matrix.spec.ts
          e2e/vec006-tool-shortcut-parity.spec.ts
