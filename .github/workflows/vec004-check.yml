name: VEC004 stacked validation

on:
  pull_request:
    branches:
      - task/vec-003-interaction-lifecycle-controller

permissions:
  contents: read

jobs:
  core:
    if: github.head_ref == 'task/vec-004-width-smooth-text-lifecycle'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && corepack prepare pnpm@10.12.1 --activate
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build

  e2e:
    if: github.head_ref == 'task/vec-004-width-smooth-text-lifecycle'
    needs: core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && corepack prepare pnpm@10.12.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vectoria/web exec playwright install --with-deps chromium
      - name: VEC004 regressions
        run: pnpm --filter @vectoria/web exec playwright test e2e/vec004-interaction-lifecycle.spec.ts
      - name: Find & Replace compatibility
        run: pnpm --filter @vectoria/web exec playwright test e2e/editor.spec.ts --grep "Find & Replace dialog opens"
