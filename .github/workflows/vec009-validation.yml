name: VEC009 Validation

on:
  push:
    branches:
      - task/vec-009-assets-semantic-tokens

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm --filter @vectoria/web exec playwright install --with-deps chromium

      - name: VEC009 regression
        run: pnpm --filter @vectoria/web exec playwright test e2e/vec009-assets-semantic-tokens.spec.ts
