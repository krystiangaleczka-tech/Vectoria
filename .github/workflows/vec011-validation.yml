name: VEC011 validation

on:
  push:
    branches:
      - task/vec-011-canvas-keyboard-router

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: Install Chromium
        run: pnpm --filter @vectoria/web exec playwright install --with-deps chromium

      - name: Keyboard and lifecycle regressions
        run: >-
          pnpm --filter @vectoria/web exec playwright test
          e2e/nudge.spec.ts
          e2e/escape.spec.ts
          e2e/vec004-interaction-lifecycle.spec.ts
          e2e/vec005-tool-lifecycle-matrix.spec.ts
          e2e/vec006-tool-shortcut-parity.spec.ts
