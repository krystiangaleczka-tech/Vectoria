name: Apply VEC004 patch on PR

on:
  pull_request:
    branches:
      - task/vec-003-interaction-lifecycle-controller

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'task/vec-004-width-smooth-text-lifecycle'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply lifecycle patch
        shell: bash
        run: |
          git apply .github/vec004.patch
          python <<'PY'
          from pathlib import Path
          p = Path('apps/web/e2e/editor.spec.ts')
          s = p.read_text()
          old = "    await page.keyboard.type('Fox and Badger');\n    await page.keyboard.press('Escape');"
          new = "    // Escape cancels the inline draft; the created object keeps its initial text.\n    await page.keyboard.press('Escape');"
          if old not in s:
              raise SystemExit('expected Find & Replace text setup was not found')
          s = s.replace(old, new, 1)
          old_query = "    await page.getByTestId('find-input').fill('Fox');"
          if old_query not in s:
              raise SystemExit('expected Find & Replace query was not found')
          s = s.replace(old_query, "    await page.getByTestId('find-input').fill('Text');", 1)
          p.write_text(s)
          PY
          git rm .github/vec004.patch .github/workflows/vec004-apply.yml .github/workflows/vec004-pr-apply.yml
          git add apps/web/src/features/canvas/CanvasViewport.tsx apps/web/e2e/editor.spec.ts apps/web/e2e/vec004-interaction-lifecycle.spec.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(vec004): migrate width smooth and text lifecycle'
          git push origin HEAD:${{ github.head_ref }}
