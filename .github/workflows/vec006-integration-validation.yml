name: VEC006 Integration Validation

on:
  push:
    branches:
      - merge/vec-006-after-vec-005

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @vectoria/web exec playwright install --with-deps chromium
      - run: pnpm --filter @vectoria/web exec playwright test e2e/vec005-tool-lifecycle-matrix.spec.ts e2e/vec006-tool-shortcut-parity.spec.ts
