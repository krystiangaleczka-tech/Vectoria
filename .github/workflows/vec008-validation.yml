name: VEC008 validation

on:
  push:
    branches:
      - task/vec-008-symbol-rename-ux

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm --filter @vectoria/web exec playwright install --with-deps chromium

      - name: VEC008 E2E
        run: pnpm --filter @vectoria/web exec playwright test e2e/vec008-symbol-rename-ux.spec.ts
