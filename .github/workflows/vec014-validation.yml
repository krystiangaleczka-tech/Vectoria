name: VEC014 Validation

on:
  push:
    branches:
      - task/vec-014-format-fidelity-corpus

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: VEC014 corpus
        run: pnpm --filter @vectoria/io exec vitest run test/format-corpus.test.ts

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm --filter @vectoria/web exec playwright install --with-deps chromium

      - name: E2E
        run: pnpm test:e2e
