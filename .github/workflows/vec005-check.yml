name: VEC005 stacked validation

on:
  push:
    branches:
      - task/vec-005-tool-lifecycle-matrix

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && corepack prepare pnpm@10.12.1 --activate
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build

  e2e:
    needs: core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && corepack prepare pnpm@10.12.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vectoria/web exec playwright install --with-deps chromium
      - name: VEC004 + VEC005 lifecycle regressions
        run: pnpm --filter @vectoria/web exec playwright test e2e/vec004-interaction-lifecycle.spec.ts e2e/vec005-tool-lifecycle-matrix.spec.ts
